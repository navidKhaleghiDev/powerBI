services:
    postgres:
      image: postgres:17
      container_name: cdc-postgres
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: financial_db
      ports:
        - "5433:5432"
      command:
        - postgres
        - -c
        - wal_level=logical
        - -c
        - max_wal_senders=4
        - -c
        - max_replication_slots=4
      volumes:
        - pg_data:/var/lib/postgresql/data
        - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d financial_db"]
        interval: 10s
        timeout: 5s
        retries: 5
      networks:
        - bi-net

    kafka:
      image: confluentinc/cp-kafka:7.8.3
      container_name: cdc-kafka
      hostname: kafka
      ports:
        - "9092:9092"
      environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
        KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
        KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
        KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      volumes:
        - kafka_data:/var/lib/kafka/data
      networks:
        - bi-net


    connect:
      # The published legacy UI requires the pre-2.4 Connect REST endpoints.
      image: quay.io/debezium/connect:2.3.4.Final
      container_name: cdc-connect
      ports:
        - "8083:8083"
      environment:
        BOOTSTRAP_SERVERS: kafka:29092
        GROUP_ID: cdc-connect-group
        CONFIG_STORAGE_TOPIC: connect_configs
        OFFSET_STORAGE_TOPIC: connect_offsets
        STATUS_STORAGE_TOPIC: connect_statuses
        CONFIG_STORAGE_REPLICATION_FACTOR: 1
        OFFSET_STORAGE_REPLICATION_FACTOR: 1
        STATUS_STORAGE_REPLICATION_FACTOR: 1
        KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
        VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
        KEY_CONVERTER_SCHEMAS_ENABLE: "false"
        VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
        ENABLE_DEBEZIUM_KC_REST_EXTENSION: "true"
      depends_on:
        - kafka
      networks:
        - bi-net

    kafka-ui:
      image: ghcr.io/kafbat/kafka-ui:latest
      container_name: cdc-kafka-ui
      restart: unless-stopped
      ports:
        - "127.0.0.1:8081:8080"
      environment:
        KAFKA_CLUSTERS_0_NAME: bi
        KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
        KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
        KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      depends_on:
        - kafka
        - connect
      networks:
        - bi-net

    debezium-ui:
        image: quay.io/debezium/debezium-ui:2.4
        container_name: cdc-debezium-ui
        restart: unless-stopped
        ports:
          - "0.0.0.0:8080:8080"
        environment:
          KAFKA_CONNECT_URIS: http://connect:8083
        depends_on:
          - connect
        networks:
          - bi-net

networks:
  bi-net:
    driver: bridge

volumes:
  pg_data:
  kafka_data:
    
